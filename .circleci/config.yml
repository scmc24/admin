version: 2.1

jobs:
  build:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - run: docker build -t registry.example.com/admin:latest .

  test:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - run: docker run --rm registry.example.com/admin:latest test

  security-scan:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - run: echo "Running SAST (BLOCKING)"
      - run: echo "Running Secret Scan (BLOCKING)"

  deploy:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - run: echo "Manual deploy, utilisez le bouton Deploy/Sync de l extension VS Code."

workflows:
  admin-pipeline:
    jobs:
      - build
      - test:
          requires:
            - build
      - security-scan:
          requires:
            - build
      - deploy:
          requires:
            - test
            - security-scan
