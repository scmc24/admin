version: 2.1

jobs:
  build:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      - run: docker build -t registry.example.com/admin:latest .
      - run: docker save registry.example.com/admin:latest -o image.tar
      - persist_to_workspace:
          root: .
          paths:
            - image.tar

  test:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - attach_workspace:
          at: .
      - run: docker load -i image.tar
      - run: docker run --rm registry.example.com/admin:latest test

  security-scan:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - run: echo "Running SAST (BLOCKING)"
      - run: echo "Running Secret Scan (BLOCKING)"

  deploy:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - run: echo "Manual deploy, utilisez le bouton Deploy/Sync de l extension VS Code."

workflows:
  admin-pipeline:
    jobs:
      - build
      - test:
          requires:
            - build
      - security-scan:
          requires:
            - build
      - deploy:
          requires:
            - test
            - security-scan
