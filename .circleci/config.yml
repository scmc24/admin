version: 2.1

jobs:
  build:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      - run: docker build -t registry.example.com/admin:latest .
      - run: docker save registry.example.com/admin:latest -o image.tar
      - persist_to_workspace:
          root: .
          paths:
            - image.tar

  test:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - attach_workspace:
          at: .
      - run: docker load -i image.tar
      - run: docker run --rm registry.example.com/admin:latest test

  security-scan:
    docker:
      - image: python:3.12
    steps:
      - checkout
      - run: echo "SAST (BLOCKING)"
      - run: pip install --quiet pip-audit && pip-audit -r requirements.txt
      - run: echo "Secret Scan (BLOCKING)"
      - run: curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b /usr/local/bin && gitleaks detect --no-git -v

  deploy:
    docker:
      - image: docker:dind
    steps:
      - checkout
      - run: mkdir -p ~/.ssh
      - run: echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
      - run: chmod 600 ~/.ssh/id_ed25519
      - run: ssh -o StrictHostKeyChecking=no deploy@185.187.170.204 "cd ~/admin && docker compose up -d --remove-orphans"

workflows:
  admin-pipeline:
    jobs:
      - build
      - test:
          requires:
            - build
      - security-scan:
          requires:
            - build
      - deploy:
          requires:
            - test
            - security-scan
